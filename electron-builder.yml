appId: io.github.tanmay-73.diskgrove
productName: DiskGrove
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - LICENSE
asar: true
# Releases are uploaded by .github/workflows/release.yml and the app has no auto-updater.
publish: null
# License texts for the libraries bundled into the renderer, readable outside the ASAR.
# THIRD_PARTY_LICENSES.txt is generated by `npm run build`.
extraResources:
  - from: out/renderer/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The renderer is loaded with loadFile(), which needs the default file:// privileges.
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true

# Icons are generated from resources/icon.svg by `npm run icons`.
win:
  target:
    - nsis
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.png
  extraResources:
    - from: resources/uninstall.sh
      to: uninstall.sh
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: resources/icons
  extraResources:
    - from: resources/uninstall.sh
      to: uninstall.sh
    # Window icon: an AppImage that is not desktop-integrated has no other source.
    # The .deb also installs it into the icon theme.
    - from: resources/icons/256x256.png
      to: icon.png
  category: Utility
  # Names the desktop entry after package.json's desktopName, which Electron also uses
  # as the window's app ID, so the dock matches the running window to its launcher.
  syncDesktopName: true
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Uninstall cleanup: asks whether to keep settings, removes caches and the
  # installer copy that the stock uninstaller leaves behind.
  include: resources/installer.nsh
deb:
  # Debian needs a maintainer, and package.json's author has no email address.
  maintainer: Tanmay Patel <https://github.com/tanmay-73/diskgrove/issues>
  synopsis: Disk space analyzer
  description: Browse folder sizes as a tree, treemap or chart, find large and duplicate files, and clean them up.
  packageCategory: utils
  # electron-builder's defaults plus the GBM and ALSA libraries Electron loads, which
  # minimal installs may lack. Ubuntu 24.04's t64 packages provide these names,
  # except that apt can pick liboss4-salsa-asound2 for a bare libasound2 there, and
  # Electron fails to start against it.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
  # The default recommends libappindicator3-1, which is for tray icons (DiskGrove has
  # none) and is not packaged by current Debian and Ubuntu releases.
  recommends: []
  # Installs to /opt/DiskGrove with a /usr/bin/diskgrove link. electron-builder's
  # scripts make chrome-sandbox setuid only where user namespaces are unavailable,
  # and install an AppArmor profile on Ubuntu 24.04 and later.
appImage:
  # electron-builder's default menu entry passes --no-sandbox. Without it, AppRun
  # still adds the flag where user namespaces are unavailable, and keeps the
  # Chromium sandbox everywhere else.
  executableArgs: []
