name: Release

# Pushing a tag such as v1.0.0 builds the installers on each platform and attaches
# them to a draft release. Review the draft, then publish it by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  draft:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # gh appends the generated notes after --notes.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "DiskGrove $GITHUB_REF_NAME" \
              --notes "The macOS builds are in beta. Please report any problems in Issues."

  # Builds run npm packages, so they get a read-only token. The upload job below holds
  # the write permission and runs no project code.
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, linux]
          - os: windows
            runner: [self-hosted, windows]
          - os: macos
            runner: macos-latest
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Signing is not configured; stop electron-builder looking for a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - name: Collect installers and checksums
        run: node .github/scripts/collect-installers.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    # Attach the platforms that did build, as the per-platform uploads did before.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Self-hosted workspaces persist between runs, and this job has no checkout to
      # clean them, so clear out installers left by an earlier release.
      - name: Clear old installers
        run: rm -rf installers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Attach installers and checksums to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- installers/*
          if [ ! -e "$1" ]; then
            echo "::error::No installer artifacts downloaded"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" installers/* --clobber
