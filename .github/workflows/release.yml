name: Release

# Pushing a tag such as v1.0.0 builds the installers on each platform and attaches
# them to a draft release. Review the draft, then publish it by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # gh appends the generated notes after --notes.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "DiskGrove $GITHUB_REF_NAME" \
              --notes "The macOS builds are in beta. Please report any problems in Issues."

  # Builds run npm packages, so they get a read-only token. The upload job below holds
  # the write permission and runs no project code.
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Signing is not configured; stop electron-builder looking for a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - name: Collect installers and checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found in release/"
            exit 1
          fi
          mkdir installers
          for file in "${files[@]}"; do
            cp "$file" installers/
            if command -v sha256sum >/dev/null; then
              (cd installers && sha256sum "${file##*/}") > "installers/${file##*/}.sha256"
            else
              (cd installers && shasum -a 256 "${file##*/}") > "installers/${file##*/}.sha256"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    # Attach the platforms that did build, as the per-platform uploads did before.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Attach installers and checksums to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" installers/* --clobber
