apply plugin: 'com.android.application'

// The app takes its version from package.json, like the desktop builds.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def versionParts = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!versionParts.find()) throw new GradleException("package.json version ${appVersion} is not major.minor.patch")
def (major, minor, patch) = (1..3).collect { versionParts.group(it).toInteger() }
if (minor > 99 || patch > 99) throw new GradleException("versionCode needs minor and patch below 100")

android {
    namespace = "io.github.tanmay73.diskgrove"
    compileSdk = rootProject.ext.compileSdkVersion
    // Exercise the same signed, non-debuggable APK that the release workflow ships.
    testBuildType "release"
    defaultConfig {
        applicationId "io.github.tanmay73.diskgrove"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Signed with the build machine's debug key, so a release installs without a keystore to keep.
            // Each build machine has its own key: Android only updates an app signed with the same one.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// The app's THIRD_PARTY_LICENSES.txt lists the Java libraries from third-party-libraries.json (see
// vite.android.config.ts), so a library missing from that list stops the build. Capacitor's own
// projects come from npm and are covered there.
def listedGroups = new groovy.json.JsonSlurper().parse(rootProject.file('third-party-libraries.json')).collectMany { it.groups }
tasks.register('checkThirdPartyLibraries') {
    def runtime = configurations.named('releaseRuntimeClasspath')
    doLast {
        def unlisted = runtime.get().incoming.resolutionResult.allComponents
            .collect { it.id }
            .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            .findAll { id -> !listedGroups.any { group -> group.endsWith('.*') ? id.group.startsWith(group[0..-2]) : id.group == group } }
            .collect { it.displayName }
        if (unlisted) {
            throw new GradleException("List these libraries and their licenses in android/third-party-libraries.json: ${unlisted.join(', ')}")
        }
    }
}
tasks.named('preBuild') { dependsOn 'checkThirdPartyLibraries' }

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
